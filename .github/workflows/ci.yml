name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.21'
          python-version: '3.12'
      - name: Install Linux engines
        timeout-minutes: 5
        if: runner.os == 'Linux'
        run: sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 && sudo apt-get install -y ffmpeg aria2
      - name: Install macOS engines
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg aria2
      - name: Install Windows engines
        if: runner.os == 'Windows'
        run: choco install ffmpeg aria2 -y --no-progress
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
        env:
          FREES_TOOLS_HOME: ${{ runner.temp }}/frees-tools-tests
      - run: uv run Frees-Tools --version
      - run: uv run frees-tools --help
      - run: uv run Frees-Tools --json doctor
      - run: uv build
      - run: uv run python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
