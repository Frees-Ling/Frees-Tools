[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frees-tools"
version = "0.1.0"
description = "Cross-platform terminal toolbox for images, PDF, video and BitTorrent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["textual>=1.0,<7", "typer>=0.15,<1", "Pillow>=11,<13", "pypdf>=5,<7", "platformdirs>=4,<5"]

[project.scripts]
Frees-Tools = "frees_tools.cli:main"
frees-tools = "frees_tools.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.11", "build>=1.2", "pyinstaller>=6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
